# ==============================================================================
# pytest 配置
# 运行方式：
#   pytest                           # 执行全部 @data 用例
#   pytest -m P0                     # 仅 P0 冒烟集
#   pytest -m "cart and P1"          # 购物车模块且 P1
#   pytest -k "MALL-E2E"             # 按用例编号过滤
#   pytest --module 加入购物车        # 按模块过滤（自定义参数，可多次指定）
#   pytest --priority P0 --tags smoke
#   pytest --ui-headed --ui-slowmo 500   # 本地调试：有头 + 放慢
# 报告：
#   allure generate reports/allure-results -o reports/allure-report --clean
#   allure open reports/allure-report
# ==============================================================================
[pytest]
minversion = 7.0
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short
    -p no:cacheprovider

markers =
    P0: 核心主链路冒烟用例，必须优先执行
    P1: 重要功能与关键异常分支
    P2: 一般功能与体验类
    P3: 建议类低风险用例
    cart: 加入购物车模块
    delete: 删除购物车记录模块
    e2e: 端到端主流程
    smoke: 冒烟集
    regression: 回归集
    api: 含接口层断言的用例
    security: 安全与鉴权相关
    persistence: 数据持久化相关
    guest: 游客态相关
    isolation: 数据隔离相关
    amount: 金额计算相关
    defect: 缺陷复现用例
    concurrency: 并发与重复操作相关
    ui: 界面交互相关
    session: 会话与登录态相关
    exception: 异常场景相关
    core: 核心链路
    note: 说明类用例

log_cli = false
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
